<!doctype html>
<html lang="fr" data-fr-scheme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Affectation ULIS</title>
  <!-- DSFR auto-hébergé : voir README (npm install && npm run vendor). -->
  <link rel="stylesheet" href="vendor/dsfr/dsfr.min.css">
  <link rel="stylesheet" href="src/style.css">
  <!-- API de plugin Grist. Si possible, remplacer par celle de ton instance
       (https://<ton-instance-grist>/grist-plugin-api.js) : le script ne reçoit aucune donnée,
       mais on évite ainsi toute requête vers un serveur tiers. -->
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
</head>
<body>
  <main class="fr-container fr-py-2w" id="app">
    <div id="stepper"></div>
    <div id="notice" aria-live="polite"></div>

    <!-- Étape 1 : recherche -->
    <section id="step-1" aria-labelledby="h-step-1" hidden>
      <h2 id="h-step-1" class="fr-sr-only" tabindex="-1">Rechercher l'élève</h2>
      <form id="form-search" novalidate>
        <div class="fr-grid-row fr-grid-row--gutters">
          <div class="fr-col-12 fr-col-md-4">
            <div class="fr-input-group">
              <label class="fr-label" for="q-nom">Nom</label>
              <input class="fr-input" id="q-nom" name="nom" type="text" autocomplete="off">
            </div>
          </div>
          <div class="fr-col-12 fr-col-md-4">
            <div class="fr-input-group">
              <label class="fr-label" for="q-prenom">Prénom</label>
              <input class="fr-input" id="q-prenom" name="prenom" type="text" autocomplete="off">
            </div>
          </div>
          <div class="fr-col-12 fr-col-md-4">
            <div class="fr-input-group">
              <label class="fr-label" for="q-ddn">Date de naissance
                <span class="fr-hint-text">Facultative pour chercher</span>
              </label>
              <input class="fr-input" id="q-ddn" name="ddn" type="date">
            </div>
          </div>
        </div>
        <button class="fr-btn fr-mt-2w" type="submit">Rechercher</button>
      </form>
    </section>

    <!-- Étape 2 : choisir une fiche ou en créer une -->
    <section id="step-2" aria-labelledby="h-step-2" hidden>
      <h2 id="h-step-2" class="fr-sr-only" tabindex="-1">Choisir ou créer la fiche de l'élève</h2>
      <div id="results"></div>
      <div class="fr-btns-group fr-btns-group--inline fr-mt-2w">
        <button class="fr-btn fr-btn--secondary" type="button" id="btn-show-create">Créer une nouvelle fiche</button>
        <button class="fr-btn fr-btn--tertiary" type="button" id="btn-back-1">Nouvelle recherche</button>
      </div>
      <form id="form-create" class="fr-mt-3w" novalidate hidden>
        <fieldset class="fr-fieldset" aria-labelledby="legend-create">
          <legend class="fr-fieldset__legend" id="legend-create"><h3 class="fr-h5">Nouvelle fiche dans Individus</h3></legend>
          <div class="fr-fieldset__element">
            <div class="fr-input-group">
              <label class="fr-label" for="c-nom">Nom</label>
              <input class="fr-input" id="c-nom" type="text" autocomplete="off">
            </div>
          </div>
          <div class="fr-fieldset__element">
            <div class="fr-input-group">
              <label class="fr-label" for="c-prenom">Prénom</label>
              <input class="fr-input" id="c-prenom" type="text" autocomplete="off">
            </div>
          </div>
          <div class="fr-fieldset__element">
            <div class="fr-input-group">
              <label class="fr-label" for="c-ddn">Date de naissance</label>
              <input class="fr-input" id="c-ddn" type="date">
            </div>
          </div>
          <div class="fr-fieldset__element">
            <div class="fr-checkbox-group">
              <input type="checkbox" id="c-ddn-inconnue">
              <label class="fr-label" for="c-ddn-inconnue">Date de naissance inconnue
                <span class="fr-hint-text">Sans date, deux homonymes ne peuvent pas être distingués.</span>
              </label>
            </div>
          </div>
        </fieldset>
        <button class="fr-btn" type="submit">Créer la fiche et continuer</button>
      </form>
    </section>

    <!-- Étape 3 : scolarité -->
    <section id="step-3" aria-labelledby="h-step-3" hidden>
      <h2 id="h-step-3" class="fr-h4" tabindex="-1">Affectation</h2>
      <p id="eleve-resume" class="fr-text--lg"></p>
      <div id="scol-list"></div>
      <div class="fr-btns-group fr-btns-group--inline fr-mt-2w">
        <button class="fr-btn" type="button" id="btn-new-scol">Nouvelle affectation</button>
        <button class="fr-btn fr-btn--tertiary" type="button" id="btn-back-1b">Autre élève</button>
      </div>
      <form id="form-scol" class="fr-mt-3w" novalidate hidden></form>
    </section>
  </main>

  <script type="module" src="vendor/dsfr/dsfr.module.min.js"></script>
  <script nomodule src="vendor/dsfr/dsfr.nomodule.min.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
